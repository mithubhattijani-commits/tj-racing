# TJ Racing 3D — request a Unity manual activation file (.alf), one-time setup step
#
# HISTORY (why this shape — 19 Nov 2026):
# - game-ci/unity-request-activation-file is DISCONTINUED (v2 refuses to run).
# - game-ci/unity-builder@v4 refuses to start WITHOUT a UNITY_LICENSE or
#   UNITY_SERIAL secret, so -createManualActivationFile can never run through
#   it (chicken-and-egg: the builder needs the licence to make the file that
#   creates the licence). Run #3 proved this.
# - Runs #4/#5: the job runs INSIDE game-ci's Editor Docker image and calls
#   the Editor binary directly — but the `-base` image tag contains NO Editor
#   at all (game-ci/docker's base Dockerfile installs only OS dependencies;
#   the Editor lives in the module images built from the editor Dockerfile).
#   Run #5 proved it: /opt/unity/editors/ did not exist in the base image.
#   This workflow therefore uses the `-android` image, which DOES contain the
#   Editor (plus Android Build Support, which the later export needs anyway).
# - Run #6 (android image) STILL failed: /opt/unity/editors/<version>/ is the
#   BUILDER-stage path in game-ci/docker's editor Dockerfile — the final
#   image copies the editor contents into $UNITY_PATH, and the base image
#   sets UNITY_PATH=/opt/unity. So the real binary is /opt/unity/Editor/Unity
#   (verified in game-ci/docker, 19 Nov 2026). The image also ships the
#   `unity-editor` wrapper (/usr/bin/unity-editor) which runs the Editor under
#   xvfb with -batchmode — that is the entry point used here.
# - The .alf is then activated at https://license.unity3d.com/manual (signed
#   in to the Unity account) to get the .ulf licence file, which becomes the
#   UNITY_LICENSE repo secret (along with UNITY_EMAIL + UNITY_PASSWORD).
#
# Trigger: Actions tab -> "Request Unity activation file" -> Run workflow.
# No secrets needed — this only generates the .alf file.
#
# Output: artifact "activation-file" (14-day retention) containing the .alf.

name: Request Unity activation file

on:
  workflow_dispatch:
    inputs:
      unity_version:
        description: "Unity version (the container image tag is the real pin — must stay 2022.3.62f2)"
        required: true
        default: "2022.3.62f2"

jobs:
  request:
    name: Request activation file (.alf)
    runs-on: ubuntu-latest
    container:
      image: unityci/editor:ubuntu-2022.3.62f2-android-3.2.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Editor writes Unity_v<version>.alf into the working directory
      # and quits. The binary is /opt/unity/Editor/Unity (UNITY_PATH=/opt/unity
      # in the base image; the /opt/unity/editors/<version>/ path exists only
      # in the Dockerfile's builder stage, NOT in the final image — run #6
      # proved that). Use the image's own `unity-editor` wrapper: it runs the
      # Editor under xvfb with -batchmode. No `|| true` — if the Editor fails,
      # the step must fail loudly with the Editor's own error in the log.
      - name: Create manual activation file
        run: |
          ls -la /opt/unity/Editor/Unity
          unity-editor -quit -createManualActivationFile
          ls -la *.alf

      - name: Upload activation file artifact
        uses: actions/upload-artifact@v4
        with:
          name: activation-file
          path: "*.alf"
          retention-days: 14
