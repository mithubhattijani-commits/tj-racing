# TJ Racing 3D — request a Unity manual activation file (.alf), one-time setup step
#
# WHY THIS SHAPE: the old game-ci/unity-request-activation-file action is
# DISCONTINUED ("This action is no longer supported" — run #2, 19 Nov 2026),
# and the current game.ci docs only document Unity Hub activation on a local
# machine. This workflow instead runs the Unity Editor itself with
# -createManualActivationFile, which writes Unity_v<version>.alf into the
# workspace root. The .alf is then activated at
# https://license.unity3d.com/manual (signed in to the Unity account) to get
# the .ulf licence file, which becomes the UNITY_LICENSE repo secret.
#
# Trigger: Actions tab -> "Request Unity activation file" -> Run workflow.
# No secrets needed — this only generates the .alf file.
#
# Output: artifact "activation-file" (14-day retention) containing the .alf.

name: Request Unity activation file

on:
  workflow_dispatch:
    inputs:
      unity_version:
        description: "Unity version (must stay 2022.3.62f2)"
        required: true
        default: "2022.3.62f2"

jobs:
  request:
    name: Request activation file (.alf)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Runs the Editor with -createManualActivationFile; Unity writes the
      # .alf and quits before any build starts. No buildMethod is set on
      # purpose — the flag short-circuits the run.
      - name: Create manual activation file
        uses: game-ci/unity-builder@v4
        with:
          unityVersion: ${{ inputs.unity_version }}
          targetPlatform: StandaloneWindows64
          customParameters: -quit -batchmode -createManualActivationFile

      - name: Upload activation file artifact
        uses: actions/upload-artifact@v4
        with:
          name: activation-file
          path: "*.alf"
          retention-days: 14
