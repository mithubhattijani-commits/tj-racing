# TJ Racing 3D — export the Android unityLibrary for Flutter (manual, on demand)
#
# Trigger: Actions tab -> "Export unityLibrary" -> Run workflow. NOTHING runs on
# push/PR, so this costs $0 unless someone deliberately runs it (public repo:
# GitHub Actions is free for public repositories).
#
# REQUIRED REPO SECRETS (only the user / main agent can provide these):
#   UNITY_LICENSE    Unity licence file (.ulf) contents
#   UNITY_EMAIL      Unity account email
#   UNITY_PASSWORD   Unity account password
# Without them the job fails at activation — Unity will not export unlicensed.
# See docs/EXPORT.md.
#
# Output: artifact "unityLibrary" (14-day retention — download promptly and stage
# it at ~/workspace/tj-racing-export/unityLibrary for the Flutter agent).

name: Export unityLibrary

on:
  workflow_dispatch:
    inputs:
      unity_version:
        description: "Unity version (must stay 2022.3.62f2 unless flutter_embed_unity says otherwise)"
        required: true
        default: "2022.3.62f2"

jobs:
  export:
    name: Export unityLibrary (Android)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: tj-racing-library-${{ inputs.unity_version }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            tj-racing-library-${{ inputs.unity_version }}-

      # game-ci unity-builder with a custom buildMethod runs the vendored
      # flutter_embed_unity batchmode exporter instead of a player build.
      # The exporter writes the transformed unityLibrary to -exportPath.
      - name: Export unityLibrary
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ inputs.unity_version }}
          targetPlatform: Android
          buildMethod: ProjectExporterBatchmode.ExportProject
          customParameters: -exportPath ./android/unityLibrary

      - name: Check export output
        run: |
          ls -la android/unityLibrary
          test -f android/unityLibrary/build.gradle
          test -f android/unityLibrary/src/main/AndroidManifest.xml

      - name: Upload unityLibrary artifact
        uses: actions/upload-artifact@v4
        with:
          name: unityLibrary
          path: android/unityLibrary
          retention-days: 14
